[project]
name = "petcareplus"
version = "1.0.0"
description = "Evidence-grounded, 100% offline pet-care guidance for 69 species — running entirely on your Windows machine."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "PetCare+ Contributors", email = "https://github.com/petcareplus/petcareplus"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "faiss-cpu>=1.15.0",
    "numpy>=2.5.2",
    "pyside6>=6.11.2",
    "scipy>=1.18.1",
    "sentencepiece>=0.2.2",
    "torch>=2.13.0",
    "transformers>=5.15.1",
    "huggingface-hub>=1.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.2",
    "pytest-cov>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/petcareplus/petcareplus"
Repository = "https://github.com/petcareplus/petcareplus"
Issues = "https://github.com/petcareplus/petcareplus/issues"

[project.scripts]
petcareplus = "app.__main__:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "developer*", "evaluation*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-q --tb=short"

[tool.ruff]
target-version = "py310"
line-length = 100
select = ["E", "F", "I", "UP", "B", "C4", "PTH", "T20", "PT", "PL", "SIM", "TRY", "TD", "ARG", "ERA", "PIE", "RET", "RSE", "RUF", "COM", "NPY", "PERF", "PLR", "LOG"]
ignore = ["E501", "B008"]
fixable = ["E", "F", "I", "UP", "B", "C4", "PTH", "T20", "PT", "PL", "SIM", "TRY", "TD", "ARG", "ERA", "PIE", "RET", "RSE", "RUF", "COM", "NPY", "PERF", "PLR", "LOG"]