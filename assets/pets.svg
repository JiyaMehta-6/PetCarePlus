<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f7f5ef" />
      <stop offset="100%" style="stop-color:#eef0f2" />
    </linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.08"/></filter>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <rect x="20" y="20" width="560" height="360" rx="16" fill="white" filter="url(#sh)"/>
  <!-- Header -->
  <rect x="20" y="20" width="560" height="56" rx="16" fill="#174a43"/>
  <text x="50" y="56" font-family="Segoe UI" font-size="18" font-weight="700" fill="white">🐕  My Pets</text>
  <!-- Pet cards -->
  <g filter="url(#sh)">
    <rect x="40" y="100" width="240" height="140" rx="12" fill="#fafafa" stroke="#e8ecef" stroke-width="1"/>
    <circle cx="80" cy="135" r="30" fill="#eef8f6"/>
    <text x="80" y="142" text-anchor="middle" font-size="28">🐕</text>
    <text x="140" y="125" font-family="Segoe UI" font-size="14" font-weight="700" fill="#174a43">Buddy</text>
    <text x="140" y="145" font-family="Segoe UI" font-size="12" fill="#6b8a83">Labrador Retriever · 3 yr</text>
    <circle cx="250" cy="135" r="14" fill="#9ed1c3"/>
    <text x="250" y="140" text-anchor="middle" font-size="10" fill="white" font-weight="700">✓</text>
    <text x="140" y="175" font-family="Segoe UI" font-size="11" fill="#9ed1c3">● Active profile</text>
  </g>
  <g filter="url(#sh)">
    <rect x="320" y="100" width="240" height="140" rx="12" fill="#fafafa" stroke="#e8ecef" stroke-width="1"/>
    <circle cx="360" cy="135" r="30" fill="#fef7f0"/>
    <text x="360" y="142" text-anchor="middle" font-size="28">🐱</text>
    <text x="420" y="125" font-family="Segoe UI" font-size="14" font-weight="700" fill="#174a43">Whiskers</text>
    <text x="420" y="145" font-family="Segoe UI" font-size="12" fill="#6b8a83">Persian · 5 yr</text>
    <circle cx="530" cy="135" r="14" fill="#e8ecef"/>
    <text x="530" y="140" text-anchor="middle" font-size="10" fill="#98a2b3">+</text>
  </g>
  <!-- Add new button -->
  <rect x="40" y="270" width="520" height="60" rx="12" fill="#f0fdfa" stroke="#9ed1c3" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="300" y="302" text-anchor="middle" font-family="Segoe UI" font-size="15" font-weight="600" fill="#174a43">+  Add New Pet</text>
  <text x="300" y="322" text-anchor="middle" font-family="Segoe UI" font-size="11" fill="#6b8a83">Species, breed, age → personalised answers</text>
</svg>