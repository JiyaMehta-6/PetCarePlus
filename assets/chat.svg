<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f7f5ef" />
      <stop offset="100%" style="stop-color:#eef0f2" />
    </linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.08"/></filter>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <rect x="20" y="20" width="560" height="360" rx="16" fill="white" filter="url(#sh)"/>
  <!-- Header with evidence badge -->
  <rect x="20" y="20" width="560" height="56" rx="16" fill="#174a43"/>
  <text x="50" y="56" font-family="Segoe UI" font-size="18" font-weight="700" fill="white">💬  Ask PetCare+</text>
  <rect x="440" y="32" width="120" height="32" rx="16" fill="#9ed1c3" opacity="0.2"/>
  <text x="500" y="50" text-anchor="middle" font-family="Segoe UI" font-size="11" font-weight="600" fill="#174a43">Evidence: Strong</text>
  <!-- Chat bubbles -->
  <g filter="url(#sh)">
    <!-- User question -->
    <rect x="50" y="100" width="400" height="56" rx="16" fill="#174a43"/>
    <text x="70" y="130" font-family="Segoe UI" font-size="13" fill="white">How much should I feed my 10 kg Indie dog daily?</text>
    <!-- Bot answer with citations -->
    <rect x="50" y="176" width="500" height="120" rx="16" fill="#f0fdfa" stroke="#9ed1c3" stroke-width="1"/>
    <text x="70" y="205" font-family="Segoe UI" font-size="13" font-weight="600" fill="#174a43">A typical adult Indie dog (12–25 kg) needs roughly</text>
    <text x="70" y="225" font-family="Segoe UI" font-size="13" font-weight="600" fill="#174a43">220–320 g dry food per day, split into two meals.</text>
    <text x="70" y="245" font-family="Segoe UI" font-size="13" fill="#6b8a83">Adjust to body condition (ribs/waist easily felt). [1][2]</text>
    <text x="70" y="265" font-family="Segoe UI" font-size="12" fill="#9ed1c3">Sources: Indian/Indie Dog feeding amount • Nutrition guidelines</text>
    <!-- Safety banner (collapsed) -->
    <rect x="50" y="310" width="500" height="36" rx="8" fill="#fff3e0" stroke="#f5a623" stroke-width="1"/>
    <text x="70" y="333" font-family="Segoe UI" font-size="12" fill="#b87400">⚠ No urgent safety flags detected for this query</text>
  </g>
  <!-- Input area -->
  <rect x="50" y="356" width="500" height="36" rx="18" fill="#f8f9fa" stroke="#e8ecef" stroke-width="1"/>
  <text x="70" y="378" font-family="Segoe UI" font-size="13" fill="#98a2b3">Type your question…</text>
  <circle cx="520" cy="374" r="16" fill="#174a43"/>
  <text x="520" y="379" text-anchor="middle" font-size="14" fill="white">➤</text>
</svg>