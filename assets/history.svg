<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f7f5ef" />
      <stop offset="100%" style="stop-color:#eef0f2" />
    </linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.08"/></filter>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <rect x="20" y="20" width="560" height="360" rx="16" fill="white" filter="url(#sh)"/>
  <rect x="20" y="20" width="560" height="56" rx="16" fill="#174a43"/>
  <text x="50" y="56" font-family="Segoe UI" font-size="18" font-weight="700" fill="white">📜  Conversation History</text>
  <text x="480" y="56" text-anchor="end" font-size="13" fill="rgba(255,255,255,0.7)">3 conversations</text>
  <!-- Header row -->
  <rect x="40" y="100" width="520" height="44" rx="8" fill="#f0fdfa" stroke="#9ed1c3" stroke-width="1"/>
  <text x="60" y="127" font-family="Segoe UI" font-size="12" font-weight="600" fill="#174a43">Question</text>
  <text x="320" y="127" font-family="Segoe UI" font-size="12" font-weight="600" fill="#174a43">Answer Preview</text>
  <text x="500" y="127" font-family="Segoe UI" font-size="12" font-weight="600" fill="#174a43">Pet</text>
  <!-- History items -->
  <g filter="url(#sh)">
    <rect x="40" y="156" width="520" height="60" rx="8" fill="#fafafa" stroke="#e8ecef" stroke-width="1"/>
    <text x="60" y="182" font-family="Segoe UI" font-size="12" font-weight="500" fill="#174a43">Can my dog eat chocolate?</text>
    <text x="60" y="202" font-family="Segoe UI" font-size="11" fill="#6b8a83">Chocolate contains theobromine… toxic to dogs. Dark chocolate is most dangerous…</text>
    <text x="460" y="182" font-family="Segoe UI" font-size="11" fill="#9ed1c3">🐕 Buddy</text>
    <circle cx="540" cy="186" r="10" fill="#e8ecef"/>
    <text x="540" y="190" text-anchor="middle" font-size="9" fill="#98a2b3">🗑</text>
  </g>
  <g filter="url(#sh)">
    <rect x="40" y="228" width="520" height="60" rx="8" fill="#fafafa" stroke="#e8ecef" stroke-width="1"/>
    <text x="60" y="254" font-family="Segoe UI" font-size="12" font-weight="500" fill="#174a43">How much to feed my Labrador?</text>
    <text x="60" y="274" font-family="Segoe UI" font-size="11" fill="#6b8a83">A 25–36 kg Labrador needs ~300–380 g dry food/day. Adjust to body condition…</text>
    <text x="460" y="254" font-family="Segoe UI" font-size="11" fill="#9ed1c3">🐕 Buddy</text>
    <circle cx="540" cy="258" r="10" fill="#e8ecef"/>
    <text x="540" y="262" text-anchor="middle" font-size="9" fill="#98a2b3">🗑</text>
  </g>
  <g filter="url(#sh)">
    <rect x="40" y="300" width="520" height="60" rx="8" fill="#fafafa" stroke="#e8ecef" stroke-width="1"/>
    <text x="60" y="326" font-family="Segoe UI" font-size="12" font-weight="500" fill="#174a43">My cat is vomiting, what to do?</text>
    <text x="60" y="346" font-family="Segoe UI" font-size="11" fill="#6b8a83">Single bout may be minor… repeated vomiting + blood + lethargy = emergency. See vet…</text>
    <text x="460" y="326" font-family="Segoe UI" font-size="11" fill="#9ed1c3">🐱 Whiskers</text>
    <circle cx="540" cy="330" r="10" fill="#e8ecef"/>
    <text x="540" y="334" text-anchor="middle" font-size="9" fill="#98a2b3">🗑</text>
  </g>
  <!-- Clear button -->
  <rect x="40" y="374" width="240" height="36" rx="18" fill="#fff3e0" stroke="#f5a623" stroke-width="1"/>
  <text x="160" y="396" text-anchor="middle" font-family="Segoe UI" font-size="12" font-weight="600" fill="#b87400">🗑  Clear All History</text>
</svg>