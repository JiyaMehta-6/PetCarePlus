<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f7f5ef" />
      <stop offset="100%" style="stop-color:#eef0f2" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="600" height="400" fill="url(#cardGrad)"/>
  <rect x="20" y="20" width="560" height="360" rx="16" fill="white" filter="url(#shadow)"/>
  <!-- Header bar -->
  <rect x="20" y="20" width="560" height="56" rx="16" fill="#174a43">
    <animate attributeName="opacity" from="1" to="1" dur="1s" fill="freeze"/>
  </rect>
  <circle cx="50" cy="48" r="18" fill="#9ed1c3" opacity="0.2"/>
  <text x="80" y="56" font-family="Segoe UI" font-size="18" font-weight="700" fill="white">PetCare+</text>
  <!-- Logo area -->
  <circle cx="300" cy="150" r="60" fill="#eef8f6" stroke="#9ed1c3" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="300" y="158" text-anchor="middle" font-family="Segoe UI" font-size="24" font-weight="700" fill="#174a43">🐾</text>
  <!-- Quick action cards -->
  <g filter="url(#shadow)">
    <rect x="60" y="240" width="160" height="100" rx="12" fill="#f0fdfa" stroke="#9ed1c3" stroke-width="1"/>
    <text x="140" y="275" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="600" fill="#174a43">Ask a Question</text>
    <text x="140" y="295" text-anchor="middle" font-family="Segoe UI" font-size="11" fill="#6b8a83">Type any pet question</text>
    <rect x="220" y="240" width="160" height="100" rx="12" fill="#fef7f0" stroke="#f5a623" stroke-width="1"/>
    <text x="300" y="275" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="600" fill="#b87400">Add a Pet</text>
    <text x="300" y="295" text-anchor="middle" font-family="Segoe UI" font-size="11" fill="#9b701f">Profile for personalised answers</text>
    <rect x="380" y="240" width="160" height="100" rx="12" fill="#f0f4ff" stroke="#4a90d9" stroke-width="1"/>
    <text x="460" y="275" text-anchor="middle" font-family="Segoe UI" font-size="14" font-weight="600" fill="#2d5aa0">Browse Knowledge</text>
    <text x="460" y="295" text-anchor="middle" font-family="Segoe UI" font-size="11" fill="#4a7db8">3,751 curated chunks</text>
  </g>
  <!-- Theme toggle indicator -->
  <circle cx="540" cy="48" r="14" fill="#eef0f2" stroke="#d0d5dd" stroke-width="1"/>
  <circle cx="540" cy="48" r="6" fill="#9ed1c3"/>
</svg>