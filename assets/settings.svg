<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f7f5ef" />
      <stop offset="100%" style="stop-color:#eef0f2" />
    </linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.08"/></filter>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <rect x="20" y="20" width="560" height="360" rx="16" fill="white" filter="url(#sh)"/>
  <rect x="20" y="20" width="560" height="56" rx="16" fill="#174a43"/>
  <text x="50" y="56" font-family="Segoe UI" font-size="18" font-weight="700" fill="white">⚙️  Settings</text>
  <!-- Theme selector -->
  <g filter="url(#sh)">
    <rect x="40" y="100" width="520" height="70" rx="12" fill="#fafafa" stroke="#e8ecef" stroke-width="1"/>
    <text x="60" y="125" font-family="Segoe UI" font-size="14" font-weight="600" fill="#174a43">Appearance</text>
    <text x="60" y="145" font-family="Segoe UI" font-size="12" fill="#6b8a83">Choose theme mode — applies instantly</text>
    <!-- Theme buttons -->
    <rect x="380" y="115" width="75" height="36" rx="18" fill="#9ed1c3"/>
    <text x="417" y="137" text-anchor="middle" font-size="12" font-weight="600" fill="white">Light</text>
    <rect x="465" y="115" width="75" height="36" rx="18" fill="#e8ecef" stroke="#d0d5dd"/>
    <text x="502" y="137" text-anchor="middle" font-size="12" fill="#6b8a83">Dark</text>
    <rect x="305" y="115" width="75" height="36" rx="18" fill="#e8ecef" stroke="#d0d5dd"/>
    <text x="342" y="137" text-anchor="middle" font-size="12" fill="#6b8a83">System</text>
  </g>
  <!-- Model path -->
  <g filter="url(#sh)">
    <rect x="40" y="190" width="520" height="70" rx="12" fill="#fafafa" stroke="#e8ecef" stroke-width="1"/>
    <text x="60" y="215" font-family="Segoe UI" font-size="14" font-weight="600" fill="#174a43">Generation Model</text>
    <text x="60" y="235" font-family="Segoe UI" font-size="11" font-family="Consolas, monospace" fill="#6b8a83">D:\projects\petCareplus\models\llm\qwen</text>
    <rect x="380" y="205" width="140" height="36" rx="18" fill="#e8ecef" stroke="#d0d5dd"/>
    <text x="450" y="227" text-anchor="middle" font-size="12" fill="#6b8a83">Browse…</text>
  </g>
  <!-- Data location -->
  <g filter="url(#sh)">
    <rect x="40" y="280" width="520" height="70" rx="12" fill="#f0fdfa" stroke="#9ed1c3" stroke-width="1"/>
    <text x="60" y="305" font-family="Segoe UI" font-size="14" font-weight="600" fill="#174a43">Data Location (read-only)</text>
    <text x="60" y="325" font-family="Segoe UI" font-size="11" font-family="Consolas, monospace" fill="#6b8a83">D:\projects\petCareplus\data\</text>
    <text x="60" y="342" font-family="Segoe UI" font-size="11" fill="#9ed1c3">All pets, history & settings stored locally — nothing leaves this folder</text>
  </g>
</svg>